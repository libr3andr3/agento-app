[package]
name = "yaya-wire"
version = "0.1.0"
edition = "2021"
description = "Wire-level primitives shared by every yaya.tech network participant: agent identities, signed envelopes, signed HTTP requests, constant-time secrets, proxy-aware client IPs and Android key-attestation verification."
license = "MIT OR Apache-2.0"

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
http = "1"
thiserror = "2"
x509-parser = { version = "0.17", features = ["verify"] }
base64 = "0.22"

[dev-dependencies]
rcgen = { version = "0.13", features = ["pem"] }
