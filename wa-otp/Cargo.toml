[package]
name = "wa-otp"
version = "0.1.0"
edition = "2021"

[dependencies]
yaya-wire = { path = "../wire" }
whatsapp-rust = "0.7"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
env_logger = "0.11"

[profile.release]
strip = true
