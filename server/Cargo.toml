[package]
name = "agente-core"
version = "0.2.0"
edition = "2021"

[lib]
name = "agente_core"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "agente-core"
path = "src/main.rs"

[dependencies]
yaya-wire = { path = "../wire" }
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "json", "chrono", "uuid", "migrate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "stream"] }
anyhow = "1"
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
rand = "0.8"
base64 = "0.22"
ml-kem = { version = "0.3", features = ["getrandom"] }
blind-rsa-signatures = "0.17"
serde_yaml = "0.9"
regex = "1"
sha2 = "0.10"
hex = "0.4"
hmac = "0.12"
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
aes-gcm = "0.10"
clap = { version = "4", features = ["derive", "env"] }
rand_core = { version = "0.6", features = ["getrandom"] }
# Verified inference (src/verified): SEV-SNP chain + report signatures,
# EHBP's HPKE, and the gzip the attestation document arrives in.
ring = "0.17"
x509-parser = "0.17"
hpke = { version = "0.12", default-features = false, features = ["alloc", "x25519"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
futures-util = { version = "0.3", default-features = false }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
android_logger = "0.15"
log = "0.4"

[profile.release]
strip = true

[dependencies.corazon]
path = "../corazon"

[dependencies.lettre]
version = "0.11"
default-features = false
features = ["smtp-transport", "tokio1", "tokio1-rustls-tls", "builder", "hostname", "pool"]

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
