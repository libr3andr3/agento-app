# Fallback vertical for businesses no specialized bundle fits yet.
# Gap events from generic clients are the raw material for new bundles.
bundle: generic
version: 2
extends: core
fields:
  staffCount:
    type: "int"
    ask_in_onboarding: true
    question_es: "¿Cuántas personas atienden?"
tools:
  - check_availability
  - book_appointment
  - collect_payment
  - handle_cancellation
# No ui: the core derives the template from businessKind (see src/ui.rs).
