[package]
name = "yaya-gateway"
version = "0.6.1"
edition = "2021"
description = "yaya.tech network edge for on-device agents: metered LLM/media gateway + NANDA-style agent registry, relay and marketplace."

[dependencies]
yaya-wire = { path = "../wire" }
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "json", "chrono", "migrate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = { version = "0.3", default-features = false }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
chrono = { version = "0.4", features = ["serde"] }
rand_core = { version = "0.6", features = ["getrandom"] }
uuid = { version = "1", features = ["v4"] }
hex = "0.4"
hmac = "0.12"
sha2 = "0.10"
x509-parser = "0.17"
base64 = "0.22"
chrono-tz = "0.10"
blind-rsa-signatures = "0.17"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1", "tokio1-rustls-tls", "builder", "hostname", "pool"] }

[profile.release]
strip = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
