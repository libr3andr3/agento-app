name: ci
on:
  push:
    branches: [main]
  pull_request:

# Builds, tests and lints the debug app on every push. No secrets: the debug
# build is unsigned and the unit tests don't need the native agent core.
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: assemble
        run: ./gradlew --no-daemon assembleDebug
      - name: unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: lint
        run: ./gradlew --no-daemon lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: agento-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
